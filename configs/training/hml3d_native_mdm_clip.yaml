# Train MDM (one-stage) on HumanML3D's NATIVE 263-D representation, with
# a CLIP ViT-B/32 text encoder.
#
# Pair with ``configs/model/mdm_humanml3d_native_clip.yaml``. Run via:
#
#     python -m kimodo.scripts.train_w_hml3d_native \\
#         --config configs/training/hml3d_native_mdm_clip.yaml
#
# Differences vs ``hml3d_mdm_clip.yaml`` (the kimodo-rep MDM):
#   * data: ``.npy`` files in ``new_joint_vecs/``, not ``.npz`` in kimodo_rep/.
#   * stats: HumanML3D's stock ``Mean.npy`` / ``Std.npy``.
#   * loss block names match the 263-D layout: rot_velocity, lin_velocity,
#     root_height, ric_data, rot_data, local_velocity, foot_contacts, fk, fk_v.
#   * no random_heading_aug knob (canonical data).

# ----- data -----
data:
  motion_dir: /home/jungbin_cho/HumanML3D/HumanML3D/new_joint_vecs
  text_dir:   /home/jungbin_cho/HumanML3D/HumanML3D/texts
  split_file: /home/jungbin_cho/HumanML3D/HumanML3D/train.txt
  mean_path:  /home/jungbin_cho/HumanML3D/HumanML3D/Mean.npy
  std_path:   /home/jungbin_cho/HumanML3D/HumanML3D/Std.npy
  fps: 20
  window_size: 200
  max_motion_length: 200
  min_motion_len: 40
  unit_length: 4
  clip_normalized: null
  num_workers: 8
  pin_memory: true

# ----- model -----
model_config_path: /home/jungbin_cho/kimodo_open/configs/model/mdm_humanml3d_native_clip.yaml
# stats_path is unused by the native motion_rep; kept here so shared
# helpers (build_denoiser_from_model_config) don't choke on the key.
stats_path: /home/jungbin_cho/HumanML3D/HumanML3D/stats_kimodo
denoiser_fps_override: 20
init_from_safetensors: null

# ----- text encoder (CLIP ViT-B/32, MDM-style) -----
text_encoder:
  type: clip
  model_name: openai/clip-vit-base-patch32
  pooled: true
  max_length: 22
  device: auto
  fp32: false

# ----- training loop -----
trainer:
  output_dir: ${output_dir}
  batch_size: 64
  grad_accum: 1
  num_steps: 500000
  lr: 1.0e-4                  # MDM default
  weight_decay: 0.0
  betas: [0.9, 0.999]
  warmup_steps: 2000
  log_every: 50
  ckpt_every: 10000
  viz_every: 10000
  eval_every: 0
  text_drop_prob: 0.1
  ema_decay: 0.9999
  ema_every: 1
  mixed_precision: fp32
  grad_clip: 1.0
  grad_guard_max: 10.0
  resume_from: null
  seed: 0
  fk_target: gt
  # Per-block smooth-L1 weights for the 263-D layout. Default to 1.0 across
  # blocks (a vanilla MDM-style MSE-ish recipe); FK + FK-v add geometric
  # consistency. Tune per-block if some blocks are over- or under-weighted.
  loss_weights:
    rot_velocity:   1.0
    lin_velocity:   1.0
    root_height:    1.0
    ric_data:       1.0
    rot_data:       1.0
    local_velocity: 1.0
    foot_contacts:  1.0
    fk:             0.0
    fk_v:           0.0
  smooth_l1_beta: 1.0
  phase: text

# ----- visualization -----
viz:
  num_samples: 0
  prompts: []
  num_frames: 100
  num_denoising_steps: 50
  cfg_scale: 2.5
  test_vs_gt: true
  test_split_file: /home/jungbin_cho/HumanML3D/HumanML3D/test.txt
  num_test_samples: 4
  test_max_frames: 196

output_dir: /home/jungbin_cho/kimodo_open/runs/mdm_hml3d_native_fp32
