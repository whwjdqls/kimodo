# Training config: KIMODO-style text-to-motion on HumanML3D-in-Kimodo features,
# **CLIP text-encoder variant**.
#
# Identical to hml3d.yaml except for:
#   * text_encoder.type    : llm2vec -> clip
#   * model_config_path    : kimodo_humanml3d_small.yaml (llm_shape=[1,4096])
#                            -> kimodo_humanml3d_small_clip.yaml (llm_shape=[1,512])
#   * output_dir
#
# Why: the LLM2Vec wrapper runs Llama-3-8B one sentence at a time
# (batch_size=1 inside the encoder), which dominates step time. The CLIP
# wrapper batches the forward and uses a ~63M-param text tower instead of
# 8B, so step time drops dramatically.
#
# Note: this is NOT a drop-in replacement for an existing LLM2Vec checkpoint
# (text projection size differs). Train from scratch or fine-tune carefully.

# ----- data -----
data:
  motion_dir: /home/jungbin_cho/HumanML3D/HumanML3D/kimodo_rep
  text_dir: /home/jungbin_cho/HumanML3D/HumanML3D/texts
  split_file: /home/jungbin_cho/HumanML3D/HumanML3D/train.txt
  mean_path: /home/jungbin_cho/HumanML3D/HumanML3D/Mean_kimodo.npy
  std_path: /home/jungbin_cho/HumanML3D/HumanML3D/Std_kimodo.npy
  fps: 20
  window_size: 200
  max_motion_length: 200
  min_motion_len: 40
  unit_length: 4
  random_heading_aug: true
  clip_normalized: null
  num_workers: 8
  pin_memory: true

# ----- model -----
model_config_path: /home/jungbin_cho/kimodo_open/configs/model/kimodo_humanml3d_small_clip.yaml
stats_path: /home/jungbin_cho/HumanML3D/HumanML3D/stats_kimodo
denoiser_fps_override: 20
init_from_safetensors: null

# ----- text encoder -----
# CLIP ViT-B/32 text tower; pooled [EOS] embedding (B, 1, 512).
# Same model MDM uses. max_length=22 matches MDM (SOS + 20 content + EOS).
# Switch to openai/clip-vit-large-patch14 (and llm_shape=[1,768] in the
# model config) for a stronger encoder at ~2x the cost.
text_encoder:
  type: clip
  model_name: openai/clip-vit-base-patch32
  pooled: true
  max_length: 22
  device: auto
  fp32: false

# ----- training loop -----
trainer:
  output_dir: ${output_dir}
  batch_size: 64
  grad_accum: 1
  num_steps: 500000
  lr: 1.0e-4 # this is same with mdm
  weight_decay: 0.0
  betas: [0.9, 0.999]
  warmup_steps: 2000
  log_every: 50
  ckpt_every: 10000
  viz_every: 10000
  eval_every: 0
  text_drop_prob: 0.1
  ema_decay: 0.9999 # this is the default when training it on hml3d
  ema_every: 1 # defualt for hml3d
  mixed_precision: fp32
  grad_clip: 1.0
  # Skip optimizer step when pre-clip grad_norm > this (or non-finite).
  # Healthy grad_norm ~0.05-0.2; 10.0 catches medium-bad batches before
  # they corrupt Adam, without firing on normal noise. Default in code
  # is 100, which is too lenient — bf16 runs missed early degradation.
  grad_guard_max: 10.0
  resume_from: null
  seed: 0
  loss_weights:
    smooth_root_pos: 10.0
    global_root_heading: 2.0
    local_joints_positions: 10.0
    velocities: 3.0
    global_rot_data: 10.0
    foot_contacts: 4.0
    fk: 5.0
  smooth_l1_beta: 1.0
  phase: text

# ----- visualization -----
viz:
  num_samples: 0
  prompts: []
  num_frames: 100
  num_denoising_steps: 50
  cfg_scale: 2.5
  test_vs_gt: true
  test_split_file: /home/jungbin_cho/HumanML3D/HumanML3D/test.txt
  num_test_samples: 4
  test_max_frames: 196

output_dir: /home/jungbin_cho/kimodo_open/runs/clip_base
