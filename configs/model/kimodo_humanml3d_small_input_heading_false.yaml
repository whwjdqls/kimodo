# Kimodo model schema for HumanML3D training.
#
# Smaller transformer than Kimodo-SOMA-SEED-v1.1 — MDM-base-style sizing
# (latent_dim=512, 8 layers, 4 heads, FFN 1024). Total ~50M params for the
# denoiser.
#
# Motion representation uses SMPLXSkeleton22 as a CONTAINER ONLY (its only
# purpose here is to give nbjoints=22, which sets motion_rep_dim to 273 to
# match the HumanML3D-in-Kimodo features). We do NOT call its FK — the
# rotations in the data follow HumanML3D's chain-reset semantics, not the
# parent-relative semantics of skeleton.fk(). See
# kimodo/data/humanml3d_text_motion.py for the caveat.
_target_: kimodo.model.Kimodo
num_base_steps: 1000
cfg_type: separated
denoiser:
  _target_: kimodo.model.twostage_denoiser.TwostageDenoiser
  ckpt_path: ${oc.select:checkpoint_dir, null}/model.safetensors
  motion_mask_mode: concat
  motion_rep:
    _target_: kimodo.motion_rep.KimodoMotionRep
    fps: 20
    stats_path: ${oc.select:checkpoint_dir, null}/stats/motion/
    skeleton:
      _target_: kimodo.skeleton.SMPLXSkeleton22
  llm_shape:
  - 1
  - 4096
  use_text_mask: false
  latent_dim: 512
  ff_size: 1024
  num_layers: 8
  num_heads: 4
  activation: gelu
  dropout: 0.1
  pe_dropout: 0.1
  norm_first: false
  num_text_tokens_override: 50
  input_first_heading_angle: false
