# Kimodo model schema for HumanML3D training — **CLIP text encoder** variant.
#
# Same denoiser size as kimodo_humanml3d_small.yaml; only the text dim
# changes. CLIP ViT-B/32 produces a 512-dim pooled text embedding; the
# denoiser's `nn.Linear(llm_dim, latent_dim)` adapts it transparently.
#
# llm_shape semantics: [num_text_tokens, text_dim].
#   * ViT-B/32 / ViT-B/16   -> [1, 512]
#   * ViT-L/14              -> [1, 768]
# Set the first dim to L_max (e.g. 77) if you switch the encoder to
# pooled=false to use per-token features instead of the pooled embedding.
_target_: kimodo.model.Kimodo
num_base_steps: 1000
cfg_type: separated
denoiser:
  _target_: kimodo.model.twostage_denoiser.TwostageDenoiser
  ckpt_path: ${oc.select:checkpoint_dir, null}/model.safetensors
  motion_mask_mode: concat
  motion_rep:
    _target_: kimodo.motion_rep.KimodoMotionRep
    fps: 20
    stats_path: ${oc.select:checkpoint_dir, null}/stats/motion/
    skeleton:
      _target_: kimodo.skeleton.SMPLXSkeleton22
  llm_shape:
  - 1
  - 512
  use_text_mask: false # this could be either true or false. SAME
  latent_dim: 512
  ff_size: 1024
  num_layers: 8
  num_heads: 4
  activation: gelu
  dropout: 0.1
  pe_dropout: 0.1
  norm_first: false
  num_text_tokens_override: 1
  input_first_heading_angle: true
