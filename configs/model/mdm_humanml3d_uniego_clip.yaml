# MDM-style one-stage denoiser on the UniEgoMotion-style 211-D representation.
#
# Sibling to ``mdm_humanml3d_native_clip.yaml`` (263-D). Only the motion_rep
# block differs: ``UniegoMotionRep`` defines the 211-D head-centric layout. The
# transformer architecture is identical — same 8-layer / 4-head / dim-512
# backbone, same CLIP ViT-B/32 text encoder, same ``input_first_heading_angle:
# false`` (the rep is frame-0 canonical, so per-sample heading is a no-op).
_target_: kimodo.model.Kimodo
num_base_steps: 1000
cfg_type: separated
denoiser:
  _target_: kimodo.model.onestage_denoiser.OnestageDenoiser
  ckpt_path: ${oc.select:checkpoint_dir, null}/model.safetensors
  motion_mask_mode: none
  motion_rep:
    _target_: kimodo.motion_rep.uniego.UniegoMotionRep
    fps: 20
    mean_path: /home/jungbin_cho/HumanML3D/HumanML3D/Mean_uniego.npy
    std_path: /home/jungbin_cho/HumanML3D/HumanML3D/Std_uniego.npy
    # feat_bias=1.0 (off) -> normalize with raw mean/std, matching the native
    # MDM data path (the flat masked-L2 loss has no per-block weighting anyway).
    feat_bias: 1.0
    skeleton:
      _target_: kimodo.skeleton.SMPLXSkeleton22
  llm_shape:
  - 1
  - 512
  use_text_mask: false
  latent_dim: 512
  ff_size: 1024
  num_layers: 8
  num_heads: 4
  activation: gelu
  dropout: 0.1
  pe_dropout: 0.1
  norm_first: false
  num_text_tokens_override: 1
  input_first_heading_angle: false
